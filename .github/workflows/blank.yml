# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "upcoming" ]
  pull_request:
    branches: [ "upcoming" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Make dir
        run: mkdir dkgd_archive
      # Runs a single command using the runners shell
      - name: Godot Export
        # You may pin to the exact commit or the version.
        # uses: firebelley/godot-export@930577654862a320eef793f399ee911b4479efb9
        uses: firebelley/godot-export@v7.0.0
        with:
          # The download url of the Linux Headless Godot executable.
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.5.1&flavor=stable&slug=linux.x86_64.zip&platform=linux.64
          # The url of the export templates corresponding to the Godot executable version.
          godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.5.1&flavor=stable&slug=export_templates.tpz&platform=templates
          # The path relative to the root of the git repository that contains the "project.godot" file.
          relative_project_path: .
          # If "true", all exported files will be archived into a ".zip" file.
          archive_output: true
          # If "true", files that are archived will be placed in a root folder within the archive.
          archive_root_folder: true
          # If "true", the Godot executable and export templates will be cached in the GitHub Actions workspace.
          cache: true
          # If provided, exports will be moved to this directory relative to the root of the Git repository. This setting is overridden by "use_preset_export_path".
          relative_export_path: dkgd_artifact 
          # If "true" the --verbose flag will be added when exporting Godot projects.
          verbose: true
          # Export project files as a .pck file.
          export_as_pack: false
                
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4 # Use the official action
        with:
          name: DevkitGD Artifacting # Name the artifact (e.g., 'my-build-artifact')
          path: dkgd_artifact # Specify the file or directory path to upload
          retention-days: 14 # Optional: Set how long the artifact should be retained (min 1, max 90)
    

